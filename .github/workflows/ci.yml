name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      backend: ${{ steps.paths.outputs.backend }}
      database: ${{ steps.paths.outputs.database }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test quality check selection
        run: node --test scripts/ci-paths.test.mjs
      - id: paths
        name: Select checks for this revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_CHECKS: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { selectChecks } from './scripts/ci-paths.mjs';
          const base = process.env.BASE_SHA;
          const initial = !base || /^0+$/.test(base);
          const args = initial ? ['ls-files', '-z']
            : ['diff', '--name-only', '--no-renames', '-z', base, 'HEAD'];
          const files = execFileSync('git', args, { encoding: 'utf8' }).split('\0').filter(Boolean);
          const checks = selectChecks(files, process.env.FULL_CHECKS === 'true' || initial);
          for (const [name, required] of Object.entries(checks)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${required}\n`);
          }
          NODE

  app-quality:
    name: App quality
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.9"
      - name: Install dependencies
        run: npm ci
      - name: Check Expo SDK dependencies
        run: npx --no-install expo install --check
      - name: Run lint
        run: npm run lint
      - name: TypeScript check
        run: npx --no-install tsc --noEmit
      - name: Run tests
        run: npm test -- --ci --runInBand
      - name: Export iOS JavaScript bundle
        run: npx --no-install expo export --platform ios --output-dir dist

  backend-quality:
    name: Backend quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.9"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  database-readiness:
    name: Database readiness
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require a ratified database baseline and real SQL validation
        run: node --input-type=module -e "import { assertDatabaseReadiness } from './scripts/ci-paths.mjs'; assertDatabaseReadiness();"

  quality-gate:
    name: CI Gate
    if: always()
    needs: [changes, app-quality, backend-quality, database-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require successful applicable checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_REQUIRED: ${{ needs.changes.outputs.app }}
          APP_RESULT: ${{ needs.app-quality.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          DATABASE_REQUIRED: ${{ needs.changes.outputs.database }}
          DATABASE_RESULT: ${{ needs.database-readiness.result }}
        run: |
          node --input-type=module <<'NODE'
          import { assertQualityResults } from './scripts/ci-paths.mjs';
          assertQualityResults(process.env);
          NODE

